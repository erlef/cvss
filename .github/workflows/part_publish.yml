on:
  workflow_call:
    inputs:
      releaseName:
        required: false
        type: string

name: "Publish"

permissions:
  contents: read

jobs:
  hex_publish:
    name: rebar3 hex publish

    runs-on: ubuntu-latest

    environment: "release"

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-runtime-env

      - run: rebar3 hex publish -r hexpm --yes
